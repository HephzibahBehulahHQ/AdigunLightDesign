name: Validate static core

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:studio
      - name: Upload studio reference screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-acceptance-${{ github.sha }}
          path: outputs/studio-acceptance-*.png
          if-no-files-found: warn

