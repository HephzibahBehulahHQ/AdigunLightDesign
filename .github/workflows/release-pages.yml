name: Build editor artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-pages-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          ALD_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ALD_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: lightdesign-editor-build
          path: dist
